<style>
*{box-sizing:border-box}
:root{
  --bg:#EDF1F5;--surface:#FFFFFF;--surface2:#F5F7FA;--ink:#14243D;--muted:#5B697D;--line:#D2DAE4;
  --court:#DCE5EE;--courtLine:#14243D;--team:#14243D;--teamInk:#FFFFFF;
  --warn:#8A5200;--warnBg:#FFF0CC;--ok:#156B37;--okBg:#DAF2E2;--libBg:#F0E3FA;--libInk:#5B1F8A;
  --pa:#F2BE22;--pu:#D7263D;--r4:#1F7F40;--c:#1F5FD0;--l:#8B3BC9;--pos:#186934;--neg:#B81E33;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151F;--surface:#17212E;--surface2:#1D2938;--ink:#E6ECF4;--muted:#99A8BB;--line:#2C3A4C;
    --court:#1D2A39;--courtLine:#C6D2E0;--team:#E6ECF4;--teamInk:#0E151F;
    --warn:#F6C66E;--warnBg:#3A2B0E;--ok:#82DBA0;--okBg:#123221;--libBg:#2D1D3D;--libInk:#E1C3F7;
    --c:#2F6FDB;--l:#9049CF;--pos:#5FD08A;--neg:#FF6B7D;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151F;--surface:#17212E;--surface2:#1D2938;--ink:#E6ECF4;--muted:#99A8BB;--line:#2C3A4C;
  --court:#1D2A39;--courtLine:#C6D2E0;--team:#E6ECF4;--teamInk:#0E151F;
  --warn:#F6C66E;--warnBg:#3A2B0E;--ok:#82DBA0;--okBg:#123221;--libBg:#2D1D3D;--libInk:#E1C3F7;
  --c:#2F6FDB;--l:#9049CF;--pos:#5FD08A;--neg:#FF6B7D;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
/* Mode match : fond teinté « terrain » (même luminosité que le Menu, sans coût de batterie) et liseré jaune en haut */
body.mmode{--bg:#E6EFE8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.mmode{--bg:#0B1915}}
:root[data-theme="dark"] body.mmode{--bg:#0B1915}

body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--c);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
#app{max-width:880px;margin:0 auto;padding:12px 14px 40px}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0;line-height:1.1}
h1{font-size:30px;font-weight:700}
h2{font-size:22px;font-weight:600;margin:22px 0 10px}
h3{font-size:24px;font-weight:700}
.hint{color:var(--muted);font-size:14px;margin:4px 0 10px}
/* explications masquables (Réglages › Général › Aides contextuelles) */
body.nohints .xp{display:none!important}
.hintask{border:2px solid var(--pa);margin-bottom:12px}.reco{color:var(--ok);font-weight:700;margin:-2px 0 8px 56px}.hintask .tools{margin-top:8px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.top h1{flex:1;min-width:180px}
.clublogo{height:46px;width:auto;flex:none;background:#fff;border-radius:10px;padding:3px 6px;box-shadow:0 1px 0 var(--line)}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--team);color:var(--teamInk);border-color:var(--team)}
.btn.big{min-height:60px;font-size:20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;width:100%}
.btn.danger{border-color:var(--pu);color:var(--neg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.grid2>*{min-width:0}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600}
label.f input{min-width:0;max-width:100%;margin-top:4px;font-size:16px;font-weight:500;color:var(--ink)}
label.f input[type=date]{display:block;-webkit-appearance:none;appearance:none;text-align:start}

function checkSub(set,o,i){

  if(oStarter){ if(set.pairs[o]&&set.pairs[o].st==='back')w.push('aller-retour déjà effectué'); }
  else if(set.subOf[o]){ const s=set.subOf[o]; if(i!==s)w.push('un remplacement ne peut ressortir que contre la personne remplacée'); }
  if(iStarter){
    const p=set.pairs[i];
    if(p&&p.st==='back')w.push('retour déjà effectué dans ce set');
    else if(p&&p.sub!==o)w.push('retour possible seulement à la place de son remplacement');
  } else if(set.subOf[i]){ const s=set.subOf[i]; if(set.pairs[s]&&set.pairs[s].st==='back')w.push('plus de retour possible dans ce set'); }
  return w;

function oppoIssues(m,zones,roles){

  const who=k=>`${dname(m,zones[k])} (${pnum(m,zones[k])}) au poste ${k}`;
  const pair=(a,b,label)=>{if(OPP[a]!==b){const t=new String(`${label} ne sont pas en opposition : ${who(a)}, ${who(b)}.`);t.key=label+':'+[zones[a],zones[b]].sort().join('-');out.push(t);}};
  const r4=zs('R4'),c=zs('C'),pa=zs('Pa'),pu=zs('Pu');
  if(r4.length===2)pair(r4[0],r4[1],'Les R4');
  if(c.length===2)pair(c[0],c[1],'Les centres');
  const dup=(a,lab,to)=>{const t=new String(`${lab} sont en opposition : ${who(a[0])}, ${who(a[1])}. L'opposition doit être passe / pointe.`);t.key=lab+':'+[zones[a[0]],zones[a[1]]].sort().join('-');t.fixes=a.map(k=>({p:zones[k],r:to}));t.choice=true;out.push(t);};
  if(pa.length===1&&pu.length===1)pair(pa[0],pu[0],'La passe et la pointe');
  else if(pa.length===2){if(OPP[pa[0]]!==pa[1])pair(pa[0],pa[1],'Les deux passes (jeu en 4-2)');}
  else if(pu.length===2&&OPP[pu[0]]===pu[1])dup(pu,'Deux pointes','Pa');
  else if(!pa.length){const t=new String("Aucune passe sur le terrain : l'opposition passe / pointe n'est pas assurée.");t.key='nopa';out.push(t);}

  catch(e){UPD={at:new Date(),found:null,err:String(e&&e.message||e)};if(manual){toast('Vérification impossible : pas de connexion','warn');render();}}
  // service worker : demande aussi au navigateur de vérifier s'il existe une nouvelle version
  try{if(navigator.serviceWorker){const reg=await navigator.serviceWorker.getRegistration();if(reg)reg.update().catch(()=>{});}}catch(e){}}
function watchUpdates(){if(!location.protocol.startsWith('http'))return;
  setInterval(()=>{if(!document.hidden)checkUpdate(false);},5*60*1000);
  window.addEventListener('focus',()=>checkUpdate(false));window.addEventListener('pageshow',()=>checkUpdate(false));window.addEventListener('online',()=>checkUpdate(false));
  try{if(navigator.serviceWorker){navigator.serviceWorker.getRegistration().then(reg=>{if(!reg)return;
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller){if(!ui.newVersion){ui.newVersion='';render();}checkUpdate(false);}});});});}}catch(e){}}
// Blocage de la rotation : seulement là où le navigateur le permet (appli installée ou plein écran, surtout Android)
function canLock(){if(NATIVE)return !!CAP().ScreenOrientation;return !!(screen.orientation&&typeof screen.orientation.lock==='function'&&!/iPad|iPhone|iPod/.test(navigator.userAgent)&&!(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1));}
async function applyRotLock(user){if(!canLock())return;const P=store.prefs;
  if(NATIVE){const SO=CAP().ScreenOrientation;try{if(P.rotLock){let t=(screen.orientation&&screen.orientation.type)||'portrait-primary';
      // iOS : « landscape » vaut un seul côté (l'écran se retournerait) : on bloque l'orientation exacte
      if(window.Capacitor.getPlatform()==='ios'){try{t=(await SO.orientation()).type||t;}catch(e){}await SO.lock({orientation:t});}
      else await SO.lock({orientation:t.startsWith('landscape')?'landscape':'portrait'});}else await SO.unlock();}catch(e){}return;}
  try{if(P.rotLock){if(user&&!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen().catch(()=>{});
      const t=(screen.orientation.type||'').startsWith('landscape')?'landscape':'portrait';await screen.orientation.lock(t);if(user)toast(t==='landscape'?'Rotation bloquée en paysage':'Rotation bloquée en portrait','ok');}
    else{screen.orientation.unlock&&screen.orientation.unlock();if(user)toast('Rotation débloquée','ok');}}
  catch(e){if(user){P.rotLock=false;save();toast('Cet appareil refuse le blocage de la rotation','warn');render();}}}
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement&&store.prefs.rotLock)applyRotLock(false);});

function tPos(el,c,o){

  const W=innerWidth,bar=tVis('.cbar'),Hv=bar?Math.min(innerHeight,bar.getBoundingClientRect().top):innerHeight,M=8,pad=6,GAP=12;
  const act=!!(c.st.act&&c.st.sel);
  let els=c.st.sel?[...document.querySelectorAll(c.st.sel)].filter(x=>x.offsetParent!==null&&x.getBoundingClientRect().width>0):[];
  if(c.st.up)els=els.map(x=>x.closest(c.st.up)||x);

  let r=rectOf();

  const topInset=(()=>{const v=tVis('.vtw,.dock.dtop');if(!v||els.some(e=>v.contains(e))||!els.some(e=>v.compareDocumentPosition(e)&Node.DOCUMENT_POSITION_FOLLOWING))return 0;return v.getBoundingClientRect().height;})(),top0=topInset+M;

function recepMap(S){if(F4&&S&&S.zones&&S.serving==='A')return layoutPlay(effective(S.zones,S.roles,null,'A').eff);if(!S||S.serving!=='A'||!S.zones)return null;const pc=playCoords(S.zones,S.roles,S.lib,S.serving);if(pc.mode!=='recep')return null;
  const ids=Object.keys(pc.out).filter(id=>id&&id!=='null'),R=S.roles,X=id=>pc.out[id][0],deep=(a,b)=>pc.out[b][1]-pc.out[a][1];

// Courbe compacte : départ à gauche, minimum (rouge, dessous), maximum (vert, dessus), variation à droite
function sparkLine(arr,fct,titles,ws){const W=200,H=50,TOP=12,BOT=12,vals=arr.filter(v=>v!=null);
  let lo,hi;if(fct){const a=Math.max(20,...vals.map(Math.abs))+5;lo=-a;hi=a;}else{lo=Math.max(0,Math.min(...vals)-10);hi=Math.min(100,Math.max(...vals)+10);if(hi-lo<20){const c=(hi+lo)/2;lo=Math.max(0,c-10);hi=Math.min(100,lo+20);}}
  const Y=v=>H-BOT-(v-lo)/(hi-lo)*(H-TOP-BOT),pts=arr.map((v,i)=>v==null?null:[8+i*(W-16)/Math.max(1,arr.length-1),Y(v)]),q=pts.filter(Boolean);
  let g=fct?`<line x1="4" x2="${W-4}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>`:'';
  if(q.length>2){const sm=smooth(arr,ws),qs=sm.map((v,i)=>v==null?null:[8+i*(W-16)/Math.max(1,arr.length-1),Y(v)]).filter(Boolean);g+=`<polyline points="${qs.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#F2BE22" stroke-width="2.6" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity=".85"/>`;}
  if(q.length>1)g+=`<polyline points="${q.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#2E68BA" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  const vmin=Math.min(...vals),vmax=Math.max(...vals),imin=arr.indexOf(vmin),imax=arr.lastIndexOf(vmax),sg=v=>fct&&v>0?'+':'',un=fct?' pts':' %';let lab='';
  pts.forEach((p,i)=>{if(!p)return;const mn=vmax>vmin&&i===imin,mx=vmax>vmin&&i===imax;
    g+=`<ellipse cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" rx="${mn||mx?4:2.6}" ry="${mn||mx?4:2.6}" fill="${mx?'var(--r4)':mn?'var(--pu)':'#2E68BA'}"><title>${esc(titles[i]||'')} : ${sg(arr[i])}${arr[i]}${un}</title></ellipse>`;
    if(mn||mx){const lx=Math.max(6,Math.min(94,p[0]/W*100));lab+=`<span class="spl ${mx?'mx':'mn'}" style="left:${lx.toFixed(1)}%;top:${(mx?p[1]-12:p[1]+4).toFixed(0)}px">${sg(arr[i])}${arr[i]}${un}</span>`;}});
  return `<div class="spw"><svg viewBox="0 0 ${W} ${H}" class="spark" preserveAspectRatio="none" style="height:${H}px">${g}</svg>${lab}</div>`;}

const REVIEW_CODES={'d4a61e8b3ff5466e95184652e8ea10f32789d6f47ac977bfa2531be9a82eee0b':'2027-08-31','fe5d5200dab90305c12b2844f1738aeacc6dad86a52d072f8fc1bb1a23e8e9cc':'2028-08-31'};

async function reviewCode(code){const c=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(!c||!(crypto&&crypto.subtle))return null;
  const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(c)))].map(b=>b.toString(16).padStart(2,'0')).join(''),end=REVIEW_CODES[h];

// Vente ouverte à la fin de l'essai gratuit pour tous, ou plus tôt en mode test (7 appuis sur le titre de la fiche Pro) : voir passOffers().
// Le consentement à l'exécution immédiate (renonciation au délai de rétractation) est demandé avant chaque achat.
const IAP={products:{},busy:false,taps:0,
  plugin(){return NATIVE?CAP().NativePurchases:null;},
  // Prix des deux pass, tels que le store les affiche (devise et taxes du pays)
  async load(){const P=IAP.plugin();if(!P)return;const ids=passOffers().map(o=>o.id);
    try{const r=await P.getProducts({productIdentifiers:ids,productType:'inapp'});(r.products||[]).forEach(p=>{IAP.products[p.identifier]=p;});}catch(e){}

  // Pass possédés par le compte du store : le plus tardif devient la licence ; un pass remboursé disparaît de la liste.
  // Renvoie null si le store ne répond pas (rien n'est changé), sinon le pass trouvé ou false.
  async refresh(){const P=IAP.plugin();if(!P)return null;let list;
    try{list=(await P.getPurchases({productType:'inapp',onlyCurrentEntitlements:true})).purchases||[];}catch(e){return null;}
    let best=null;list.forEach(t=>{const m=PASS_RE.exec(t.productIdentifier||'');if(!m||t.revocationDate||(t.purchaseState!=null&&String(t.purchaseState)!=='1'))return;
      const until=m[2]+'-08-31';if(!best||until>best.until)best={until,product:t.productIdentifier,tx:t.transactionId||null};});

    else if(!best&&L&&L.src==='store'){store.lic=null;save();render();}

  err(e){return String(e&&(e.code||e.message)||e||'');}

    O.slice(oa,ob).forEach(x=>{
      // même type, à la même heure (ou, sans heure, au même rang) : la même action notée différemment, la source de confiance l'emporte
      const k=tg.findIndex((t,i)=>!used.has(i)&&t[0]===x[0]&&(t[5]!=null&&x[5]!=null?Math.abs(t[5]-x[5])<=TOL:true));
      if(k>=0){used.add(k);rep.conflicts++;fill(tg[k],x);return;}
      // place retenue : le moins de ruptures, puis le moins de cycles coupés avant l'attaque, puis l'heure la plus proche
      let best=null;for(let p=from;p<=L.length;p++){const C=L.slice(0,p).concat([x],L.slice(p)),sc=phBreaks(C,prev,next).concat(tGap(L,p,x));
        if(!best||lexLess(sc,best.sc))best={p,sc};}
      L.splice(best.p,0,x);from=best.p+1;rep.added++;});
    L.forEach(t=>out.push(t));};
  pairs.forEach(([a,b])=>{gap(pa,a,pb,b,PH[T[a][0]]??2);out.push(T[a]);prev=PH[T[a][0]]??2;pa=a+1;pb=b+1;});gap(pa,T.length,pb,O.length,null);
  return out;}
function mergeMatches(loc,imp,trust){const T=trust==='imp'?imp:loc,O=trust==='imp'?loc:imp,rep={pts:0,ptsT:0,ptsO:0,added:0,filled:0,conflicts:0,setsDiff:false};
  const ST=setsOf(T),SO=setsOf(O);if(ST.length!==SO.length)rep.setsDiff=true;
  const ev=[];
  let si=-1;const ptsO=SO.map(s=>s.ev.filter(e=>e.t==='pt'));
  const pairsBySet=ST.map((s,i)=>{const pt=s.ev.filter(e=>e.t==='pt'),po=ptsO[i]||[];const pr=lcsAlign(pt,po,(a,b)=>a.w===b.w);const map=new Map(pr.map(([a,b])=>[pt[a],po[b]]));rep.ptsT+=pt.length;rep.ptsO+=po.length;rep.pts+=pr.length;return map;});
  const off=clockOffset(pairsBySet.flatMap(m=>[...m.entries()]));
  const clone=new Map();
  (T.ev||[]).forEach(e=>{if(e.t==='set'){si++;ev.push(JSON.parse(JSON.stringify(e)));return;}
    if(e.t==='pt'&&si>=0){const o=pairsBySet[si].get(e),c=JSON.parse(JSON.stringify(e));if(o)c.st=mergeSt(e.st,o.st,rep,off);clone.set(e,c);ev.push(c);return;}
    ev.push(JSON.parse(JSON.stringify(e)));});
  // temps morts présents seulement dans l'autre saisie : ajoutés au bon endroit (avant le même point aligné)
  SO.forEach((s,i)=>{if(!ST[i])return;const pt=s.ev.filter(e=>e.t==='pt');s.ev.forEach((e,k)=>{if(e.t!=='to')return;
      const tos=ST[i].ev.filter(x=>x.t==='to'&&x.s===e.s).length,toO=s.ev.slice(0,k+1).filter(x=>x.t==='to'&&x.s===e.s).length;if(toO<=tos)return;
      const nextPt=s.ev.slice(k).find(x=>x.t==='pt');const tgt=nextPt?[...pairsBySet[i].entries()].find(([a,b])=>b===nextPt):null;
      const pos=tgt?ev.indexOf(clone.get(tgt[0])):-1;
      if(pos>=0){ev.splice(pos,0,JSON.parse(JSON.stringify(e)));rep.added++;}});});
  const out=JSON.parse(JSON.stringify(T));out.ev=ev;out.id=loc.id;out.teamId=loc.teamId;if(loc.seasonId)out.seasonId=loc.seasonId;out.pend=[];out.redo=[];
  // effectif : union (joueurs saisis d'un seul côté)
  const ros=(loc.roster||[]).slice();(imp.roster||[]).forEach(p=>{if(!ros.some(x=>x.id===p.id))ros.push(p);});out.roster=ros;
  out.present=Object.assign({},O.present||{},T.present||{});out.roles=Object.assign({},O.roles||{},T.roles||{});
  out.merged=(loc.merged||0)+1;return {m:out,rep};}
function mergeReport(r,trust){return `${r.pts} point${r.pts>1?'s':''} recoupé${r.pts>1?'s':''} ; ${r.added} action${r.added>1?'s':''} ajoutée${r.added>1?'s':''} ; ${r.filled} complétée${r.filled>1?'s':''} ; ${r.conflicts} désaccord${r.conflicts>1?'s':''} tranché${r.conflicts>1?'s':''} en faveur des données ${trust==='imp'?'importées':'de cet appareil'}`+(r.ptsT!==r.ptsO?` ; nombres de points différents (${r.ptsT} / ${r.ptsO}) : la liste des points vient de la source de confiance`:'')+(r.setsDiff?' ; nombre de sets différent':'');}

// Fichier reçu par « Partager › VolleyCoach » (Android, appli installée) : mis de côté par le service worker, importé à l'ouverture
async function checkShared(){if(!/[?&]share=1/.test(location.search)||!('caches' in window))return;
  try{const c=await caches.open('volleycoach-share'),r=await c.match('./shared-file');history.replaceState(null,'',location.pathname);if(!r)return;
    const txt=await r.text();await c.delete('./shared-file');if(!txt.trim()){toast('Fichier partagé vide ou illisible','warn');return;}
    ui.tuto=null;ui.sheet=null;importText(txt);}catch(e){toast('Impossible de lire le fichier partagé','warn');}}
setTimeout(checkShared,300);
// Import à la carte (fichier de match ou de saison) : équipe de destination (ou nouvelle équipe), saison, matchs et effectif à cocher.
// Les joueurs des matchs sont rattachés à l'effectif de destination (même nom ; même numéro si le nom manque), les autres y sont ajoutés.
function impRoster(m){return Array.isArray(m&&m.roster)?m.roster:[];}
function impDup(mm,dest){if(store.cur.id===mm.id||store.arch.some(a=>a.id===mm.id))return true;if(dest==='new')return false;
  return [store.cur].concat(store.arch).some(a=>a&&a.id!==mm.id&&(a.ev||[]).length&&teamOf(a)===dest&&a.date===mm.date&&mgNorm(a.opp)!==''&&mgNorm(a.opp)===mgNorm(mm.opp));}
function impRosterOf(id){const t=store.teams.find(x=>x.id===id);return !t?[]:t.id===store.teamId?store.roster:(t.roster||[]);}
function impFind(R,p){const k=normName(p);return (k&&R.find(q=>normName(q)===k))||(!k&&R.find(q=>q.n===p.n))||null;}
function impSeasonDefault(P){if(P.dest==='new'){P.seasonSel='new';return;}const t=ensureSeasons(store.teams.find(x=>x.id===P.dest));
  const hit=P.season&&t.seasons.find(x=>x.name.toLowerCase()===P.season.toLowerCase());P.seasonSel=hit?hit.id:t.curSeason;}
function impPlan(d,list){
  const src=String(d.team||(list[0]&&list[0].team)||'Équipe importée'),by={};
  list.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(mm=>impRoster(mm).forEach(p=>{by[normName(p)||'#'+p.n]=p;}));
  let R;try{R=parseRoster(Array.isArray(d.roster)?d.roster:Object.values(by));}catch(e){R=[];}
  // 4x4 et 6x6 ne se mélangent pas : seules les équipes du même type sont proposées
  const f4=fc4((list.find(x=>x&&x.f4)||{}).f4),okT=t=>!t.locked&&fc4(t.f4)===f4;
  let dest=(store.teams.find(t=>okT(t)&&t.name.toLowerCase()===src.toLowerCase())||{}).id;
  if(!dest){let best=null;store.teams.forEach(x=>{if(!okT(x))return;const r=rosterSim(R,impRosterOf(x.id));if(r.v>=0.5&&(!best||r.v>best.v))best={id:x.id,v:r.v};});dest=best?best.id:R.length?'new':((store.teams.find(t=>okT(t)&&t.id===store.teamId)||store.teams.find(okT)||{}).id||'new');}
  const P={src,season:String(d.season||''),R,items:list.map(lean),dest,rost:true,f4};impSeasonDefault(P);
  P.sel=P.items.map((mm,i)=>impDup(mm,P.dest)?-1:i).filter(i=>i>=0);return P;}
function impLabel(mm){let sc='';try{const S=replay(mm);sc=' · '+S.wins.G+'-'+S.wins.A;}catch(e){}return `${fmtDate(mm.date)} · ${mm.opp||tr('Adversaire')}${sc}`;}
// identifiants des joueurs remplacés partout dans le match (valeurs et clés : stats, compositions, présences, postes…)
// Déplacement d'un match archivé vers une autre équipe : joueurs rattachés à son effectif (même nom), les autres ajoutés
function moveToTeam(a,t,sid){const R=t.id===store.teamId?store.roster:(t.roster||(t.roster=[])),map={};let added=0;
  impRoster(a).forEach(p=>{let q=impFind(R,p);if(!q&&R.length<MAX_ROSTER){let id=String(p.id);if(R.some(x=>x.id===id))id='r'+p.n+'_'+Math.random().toString(36).slice(2,6);q={id,n:p.n,nom:p.nom||'',pre:p.pre||'',postes:(p.postes||[]).filter(r=>ROLES[r])};R.push(q);added++;}if(q&&q.id!==p.id)map[p.id]=q.id;});
  const f4=f4c(a);if(Object.keys(map).length){const o=remapIds(a,map);Object.keys(a).forEach(k=>delete a[k]);Object.assign(a,o);}Object.assign(a,{teamId:t.id,team:t.name,seasonId:sid,f4});delete a.order;
  ui.mvTeam=null;ui.sheet='archOrg';save();toast(tr('Match déplacé vers « {N} »').replace('{N}',t.name)+(added?' · '+tr(added>1?'{N} joueurs ajoutés':'1 joueur ajouté').replace('{N}',added):''),'ok');}
function remapIds(o,map){if(Array.isArray(o))return o.map(x=>remapIds(x,map));if(o&&typeof o==='object'){const r={};for(const k in o)r[map[k]||k]=remapIds(o[k],map);return r;}return typeof o==='string'&&map[o]?map[o]:o;}
function importText(txt){
  let raw=String(txt||'').replace(/^\uFEFF/,'').trim(),d;
  try{d=JSON.parse(raw);}catch(e){const i=raw.indexOf('{'),j=raw.lastIndexOf('}');
    try{d=JSON.parse(raw.slice(i,j+1));}catch(e2){toast('Fichier illisible : ce n\'est pas un fichier de données VolleyCoach (.vbcs)','warn');return false;}}
  if(!d||typeof d!=='object'||(d.app&&!/volley/i.test(String(d.app)))||!(Array.isArray(d.arch)||Array.isArray(d.roster)||Array.isArray(d.teams)||(d.cur&&Array.isArray(d.cur.ev)))){
    toast('Ce fichier ne contient ni match ni effectif VolleyCoach','warn');return false;}
  let n=0,rn=-1;const teamsOnly=!!ui.importTeamsOnly;ui.importTeamsOnly=false;
  if(teamsOnly&&!(Array.isArray(d.teams)||Array.isArray(d.roster))){toast('Ce fichier ne contient aucun effectif','warn');return false;}
  try{
    const list=teamsOnly?[]:(d.arch||[]).concat(d.cur&&Array.isArray(d.cur.ev)&&d.cur.ev.length?[d.cur]:[]);
    if(list.length===1&&list[0]&&Array.isArray(list[0].ev)){const c=mergeCandidate(list[0]);if(c){ui.mergeQ={imp:lean(list[0]),where:c.where,id:c.m.id};ui.sheet='merge1';render();return true;}}
    const ok=list.filter(mm=>mm&&mm.id&&Array.isArray(mm.ev));
    if(!Array.isArray(d.teams)&&ok.length){ui.imp=impPlan(d,ok);ui.tuto=null;ui.sheet='impPick';render();return true;}
    list.forEach(mm=>{if(!mm||!mm.id||!Array.isArray(mm.ev))return;if(mm.id===store.cur.id||store.arch.some(a=>a.id===mm.id))return;store.arch.push(lean(mm));n++;});
    store.arch.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
    // effectifs : équipe ressemblante (≥ 50 % de joueurs en commun) → proposition de remplacement ; sinon nouvelle équipe
    const inc=Array.isArray(d.teams)?d.teams.filter(t=>!t.locked&&t.id!=='t-earth').map(t=>({name:t.name,roster:t.roster,gender:t.gender,f4:t.f4,seasons:t.seasons,curSeason:t.curSeason})):Array.isArray(d.roster)?[{name:d.team||(d.cur&&d.cur.team)||'Équipe importée',roster:d.roster}]:[];
    ui.importQ=ui.importQ||[];
    inc.forEach(t=>{let R;try{R=parseRoster(t.roster||[]);}catch(e){return;}
      const rosterOfT=x=>x.id===store.teamId?store.roster:x.roster;
      let best=null;store.teams.forEach(x=>{const r=rosterSim(R,rosterOfT(x));if(r.v>=0.5&&(!best||r.v>best.v))best={id:x.id,...r};});
      if(best){const cr=rosterOfT(store.teams.find(x=>x.id===best.id));if(JSON.stringify(R)===JSON.stringify(cr))return; // identique : rien à faire
        ui.importQ.push({name:t.name||'Équipe importée',R,match:best.id,k:best.k});}
      else{const nt=newTeamFrom(t.name,R);if(t.gender)nt.gender=t.gender;if(fc4(t.f4))nt.f4=fc4(t.f4);if(Array.isArray(t.seasons)&&t.seasons.length){nt.seasons=t.seasons.map(x=>({id:x.id,name:x.name,closed:!!x.closed}));nt.curSeason=nt.seasons.some(x=>x.id===t.curSeason)?t.curSeason:nt.seasons[nt.seasons.length-1].id;}rn=(rn<0?0:rn)+1;}});
    inc.forEach(t=>{const x=store.teams.find(y=>y.name===t.name);if(!x||!Array.isArray(t.seasons))return;ensureSeasons(x);t.seasons.forEach(so=>{if(so&&so.id&&!x.seasons.some(y=>y.id===so.id))x.seasons.push({id:so.id,name:so.name,closed:true});});});
    store.arch.forEach(a=>{if(!a.teamId||!store.teams.some(t=>t.id===a.teamId)){const t=store.teams.find(t=>t.name===a.team);a.teamId=t?t.id:store.teamId;}});
    if(ui.importQ.length)ui.sheet='teamImport';
    save();
  }catch(err){toast('Import interrompu : '+(err&&err.message||'données incomplètes'),'warn');return false;}
  try{render();}catch(err){}
  const msg=[];if(rn>0)msg.push(`${rn} nouvelle${rn>1?'s':''} équipe${rn>1?'s':''}`);if(ui.importQ&&ui.importQ.length)msg.push('effectif à confirmer');if(n)msg.push(`${n} match(s) ajouté(s) à l'archive`);
  toast(msg.length?msg.join(' ; '):'Rien de nouveau : ces matchs sont déjà dans l\'archive',msg.length?'ok':'');
  return true;
}
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
