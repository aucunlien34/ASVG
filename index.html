  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151F;--surface:#17212E;--surface2:#1D2938;--ink:#E6ECF4;--muted:#99A8BB;--line:#2C3A4C;
    --court:#1D2A39;--courtLine:#C6D2E0;--team:#E6ECF4;--teamInk:#0E151F;
    --warn:#F6C66E;--warnBg:#3A2B0E;--ok:#82DBA0;--okBg:#123221;--libBg:#2D1D3D;--libInk:#E1C3F7;
    --c:#3A78E6;--l:#A055DA;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151F;--surface:#17212E;--surface2:#1D2938;--ink:#E6ECF4;--muted:#99A8BB;--line:#2C3A4C;
  --court:#1D2A39;--courtLine:#C6D2E0;--team:#E6ECF4;--teamInk:#0E151F;
  --warn:#F6C66E;--warnBg:#3A2B0E;--ok:#82DBA0;--okBg:#123221;--libBg:#2D1D3D;--libInk:#E1C3F7;
  --c:#3A78E6;--l:#A055DA;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--c);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
#app{max-width:880px;margin:0 auto;padding:12px 14px 40px}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0;line-height:1.1}
h1{font-size:30px;font-weight:700}
h2{font-size:22px;font-weight:600;margin:22px 0 10px}
h3{font-size:24px;font-weight:700}
.hint{color:var(--muted);font-size:14px;margin:4px 0 10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.top h1{flex:1;min-width:180px}
.clublogo{height:46px;width:auto;flex:none;background:#fff;border-radius:10px;padding:3px 6px;box-shadow:0 1px 0 var(--line)}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--team);color:var(--teamInk);border-color:var(--team)}
.btn.big{min-height:60px;font-size:20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;width:100%}
.btn.danger{border-color:var(--pu);color:var(--pu)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600}
label.f input{margin-top:4px;font-size:16px;font-weight:500;color:var(--ink)}

/* role colours */
.r-Pa{--rc:var(--pa);--rci:#241B00}
.r-Pu{--rc:var(--pu);--rci:#FFFFFF}
.r-R4{--rc:var(--r4);--rci:#FFFFFF}
.r-C{--rc:var(--c);--rci:#FFFFFF}
.r-L{--rc:var(--l);--rci:#FFFFFF}
.r-none{--rc:#7A8696;--rci:#FFFFFF}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;border-radius:50%;background:var(--rc);color:var(--rci);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;flex:none}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:50%;background:var(--rc);display:inline-block}

/* setup rows */
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.off{opacity:.5}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-weight:600}
.prow .who small{color:var(--muted)}
.tick{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.tick.on{background:var(--team);border-color:var(--team);color:var(--teamInk)}
.roles{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.rc{min-width:40px;height:36px;padding:0 6px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;position:relative}
.rc.usual{border-color:var(--rc)}
.rc.on{background:var(--rc);color:var(--rci);border-color:var(--rc)}

/* scoreboard */
.dock{position:sticky;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);z-index:12;background:var(--bg);margin:12px -14px;padding:10px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 0 16px -8px rgba(0,0,0,.35)}
@media (max-height:900px) and (min-width:561px){.dock{bottom:auto}}
/* Téléphone : bloc flottant en bas, partie stats repliable */
.dtog{display:none}
@media (max-width:560px){
  .dtog{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:40px;margin-bottom:8px;border-radius:10px;border:1.5px dashed var(--line);background:var(--surface2);color:var(--ink);font-weight:600;font-size:15px}
  .dtog .cnt{background:var(--team);color:var(--teamInk);border-radius:10px;padding:1px 8px;font-size:13px}
  .dock.folded .stp,.dock.folded .stpick{display:none}
  .dock{padding:8px 14px}
  .dock .undo .btn{min-height:44px}
}
.stgrid{display:grid;grid-template-columns:68px repeat(3,minmax(0,1fr));grid-template-areas:"lm m0 m1 m2" "lp p0 p1 p2";gap:8px;align-items:center;margin-bottom:8px}
.stgrid .stb{min-width:0}
@media (max-width:560px){
  .courtwrap.side.o1,.courtwrap.side.o3{padding:20px 9%}
  .stgrid{grid-template-columns:1fr 1fr;grid-template-areas:"lm lp" "m0 p0" "m1 p1" "m2 p2";gap:6px 8px}
  .stgrid .stl{width:auto;text-align:center}
  .stgrid .stb{min-height:46px;font-size:15px;padding:0 6px}
}
.dock .stp{margin-bottom:8px}.dock .panel{margin:8px 0}.dock .undo{margin-bottom:0}.dock .undo .btn{min-height:48px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.tside{display:flex;align-items:center;gap:10px;border-radius:16px;border:3px solid var(--team);background:var(--surface);color:var(--ink);padding:6px 14px;min-height:78px;min-width:0;text-align:left}
.tside.g{background:var(--team);color:var(--teamInk)}
.tside.R{flex-direction:row-reverse;text-align:right}
.tside .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tside .tn{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tside .sw{font-size:13px;opacity:.8}
.tside .ptn{font-size:13px;font-weight:700;opacity:.9}
.tside .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:58px;line-height:1;font-variant-numeric:tabular-nums}
.tside .srvdot{display:inline-block;width:20px;height:20px;vertical-align:-3px;margin:0 4px}
.tside:not(:disabled):active{transform:scale(.97)}
.tside:disabled{cursor:default}
.smid{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;color:var(--muted);font-size:14px;min-width:46px;text-align:center;line-height:1.1}
.smid b{font-size:22px;color:var(--ink)}
.hist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.hs{font-family:'Barlow Condensed',sans-serif;font-size:15px;padding:2px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.hs.w{border-color:var(--r4)}.hs.l{border-color:var(--pu)}

/* court */
.courtbar{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.rot{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:34px;line-height:1;background:var(--pa);color:#241B00;border-radius:10px;padding:4px 12px}
.srvinfo{flex:1;font-weight:600}
.srvinfo small{display:block;color:var(--muted);font-weight:500}
.icon{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon svg{width:24px;height:24px}
.courtwrap{padding:44px 8% 60px;max-width:700px;margin:0 auto}
.courtwrap.side{max-width:640px;padding:24px 13%}
.courtwrap.o2{padding:60px 8% 44px}
.court{position:relative;aspect-ratio:4/3;container-type:inline-size;background:var(--court);border:3px solid var(--courtLine);border-radius:4px}
.court.small{max-width:420px;margin:0 auto}
.court.side{aspect-ratio:3/4}
.court.side.small{max-width:300px}
.net{position:absolute;left:-4%;right:-4%;height:10px;top:-8px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--courtLine) 0 3px,transparent 3px 9px),var(--surface);border:2px solid var(--courtLine)}
.o2 .net{top:auto;bottom:-8px}
.side .net{left:auto;right:auto;top:-4%;bottom:-4%;width:10px;height:auto;background:repeating-linear-gradient(0deg,var(--courtLine) 0 3px,transparent 3px 9px),var(--surface)}
.o1 .net{right:-8px}.o3 .net{left:-8px}
.attack{position:absolute;left:0;right:0;top:33.33%;border-top:2px dashed var(--courtLine);opacity:.45}
.o2 .attack{top:66.66%}
.side .attack{top:0;bottom:0;right:auto;border-top:0;border-left:2px dashed var(--courtLine)}
.o1 .attack{left:66.66%}.o3 .attack{left:33.33%}
.netlbl{position:absolute;left:50%;transform:translateX(-50%);top:6px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.o2 .netlbl{top:auto;bottom:6px}
.o1 .netlbl{left:auto;right:-4px;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
.o3 .netlbl{left:22px;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.court.side .tok{width:29%}
.court.side .tok .disc{width:clamp(40px,14.6cqw,84px);font-size:clamp(20px,7.4cqw,42px)}
.court.side .tok .nm{font-size:clamp(11px,3.3cqw,17px)}
.court.side .zempty{width:clamp(44px,16cqw,90px)}
.tok{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:22%;z-index:1}
.tok .disc{position:relative;width:clamp(40px,11cqw,84px);aspect-ratio:1;border-radius:50%;background:var(--rc);color:var(--rci);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(20px,5.6cqw,42px);box-shadow:0 2px 0 rgba(0,0,0,.18);border:3px solid var(--surface)}
.tok .rl{position:absolute;bottom:-6px;right:-6px;background:var(--surface);color:var(--ink);border:2px solid var(--rc);border-radius:8px;font-size:13px;line-height:1;padding:3px 5px;font-weight:700}
.tok .nm{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-weight:600;font-size:clamp(11px,2.5cqw,17px);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tok .sub{font-size:11px;color:var(--libInk);background:var(--libBg);border-radius:6px;padding:1px 6px;white-space:nowrap}
.tok .ballb{position:absolute;top:-8px;left:-8px;width:28px;height:28px}
.tok .zn{position:absolute;top:-8px;left:-8px;background:var(--ink);color:var(--bg);border-radius:6px;font-size:12px;padding:2px 5px;font-weight:700}
.tok.flash .disc{animation:flash 1.2s ease-out 2}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--l)}100%{box-shadow:0 0 0 18px transparent}}
.zempty{position:absolute;transform:translate(-50%,-50%);width:clamp(44px,12cqw,90px);aspect-ratio:1;border-radius:50%;border:2.5px dashed var(--courtLine);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;opacity:.75}
.zempty b{font-size:30px;line-height:1}
.zempty span{font-size:13px}
.viewrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}.viewseg{display:flex}.viewseg button{flex:1}.viewrow>.btn{margin-left:auto}
.libinfo{text-align:center;margin:12px 0 0;font-size:14px;color:var(--libInk);background:var(--libBg);border-radius:10px;padding:6px 10px}

/* points */
.ptbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 10px}
.pt{min-height:92px;border-radius:16px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;border:3px solid var(--team)}
.pt.g{background:var(--team);color:var(--teamInk)}
.pt.a{background:var(--surface);color:var(--ink)}
.pt:active{transform:scale(.98)}
.pt .ptn{display:block;font-size:15px;font-weight:600;opacity:.8}
.panel{background:var(--surface);border:2px solid var(--team);border-radius:16px;padding:16px;margin:14px 0 10px;text-align:center}
.panel p{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:600;margin:0 0 12px}
.panel .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.stp{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.sth{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}.sth b{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600}.sth small{color:var(--muted)}
.strow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.stl{width:68px;font-size:13px;color:var(--muted);font-weight:600}
.stb{min-height:46px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:600;flex:1 1 0;min-width:96px}
.stb.m{border-color:var(--pu)}.stb.p{border-color:var(--r4)}
.stb.m.on{background:var(--pu);color:#fff}.stb.p.on{background:var(--r4);color:#fff}
.stb:disabled{opacity:.35}
.stpick{background:var(--surface2);border-radius:10px;padding:8px;margin-bottom:8px}.stq{display:block;font-weight:700;margin-bottom:8px;font-size:17px}
.stq.m{color:var(--pu)}.stq.p{color:var(--r4)}
.pick3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:start}
.pick3 .col{display:flex;flex-direction:column;gap:8px}
.bchip.pk{width:100%;min-height:58px;border-width:2px;border-color:var(--rc);border-radius:14px;padding:5px 8px 5px 5px}
.bchip.pk .num{min-width:44px;height:44px;font-size:22px}
.pkn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stchip{display:inline-flex;align-items:center;gap:4px;padding:2px 2px 2px 10px;border-radius:20px;background:var(--surface2);border:1.5px solid var(--line);font-size:14px;font-weight:600}
.stchip.m{border-color:var(--pu)}.stchip.p{border-color:var(--r4)}
.stchip button{border:0;background:none;font-size:20px;width:34px;height:34px;line-height:1}
.undo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.undo .btn{justify-content:flex-start;text-align:left;min-height:56px}
.undo .btn span{display:flex;flex-direction:column;line-height:1.15}
.undo .btn small{font-weight:500;color:var(--muted);font-size:13px}
.undo svg{width:22px;height:22px;flex:none}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{flex:1 1 auto}
.tools small{color:var(--muted);font-weight:500}

.bench{display:flex;flex-wrap:wrap;gap:8px}
.bchip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:30px;border:1.5px solid var(--line);background:var(--surface);min-height:50px}
.bchip .num{min-width:36px;height:36px;font-size:18px}
.bchip em{font-style:normal;font-size:12px;color:var(--libInk);background:var(--libBg);border-radius:6px;padding:1px 6px}
.bchip.sel{border-color:var(--ink);border-width:3px;padding:3px 10px 3px 3px}
.bchip:disabled{opacity:.35}
.subgrp{padding:6px 0;border-bottom:1px dashed var(--line)}.subgrp:last-of-type{border-bottom:0}
.subgrp.match{background:var(--surface2);border-radius:12px;padding:8px;border-bottom:0;margin-bottom:6px}

/* sheet */
#sheet{position:fixed;inset:0;display:none;z-index:20}
#alert{position:fixed;inset:0;display:none;z-index:40;align-items:center;justify-content:center;padding:20px}
#alert.open{display:flex}
.ascrim{position:absolute;inset:0;background:rgba(8,14,24,.55)}
.abox{position:relative;background:var(--surface);border-radius:16px;padding:20px;max-width:500px;width:100%;border:3px solid var(--warn);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.abox h3{color:var(--warn);margin-bottom:10px}
.abox p{margin:0 0 10px;font-weight:500}
.abox .btn{height:auto;padding:12px 16px;line-height:1.2;width:100%}
.rolegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:6px 0 14px}.rolegrid .rc{min-height:54px;font-size:18px;border-color:var(--rc)}.rolegrid .rc:disabled{opacity:1}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,14,24,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:880px;margin:0 auto}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet .sh h3{flex:1}
.warnbox{background:var(--warnBg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.menu .btn{width:100%;justify-content:flex-start;margin-bottom:8px;min-height:56px;font-size:17px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:10px auto}
.keypad button{min-height:64px;font-size:28px;font-family:'Barlow Condensed',sans-serif;font-weight:700;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.dots{display:flex;gap:14px;justify-content:center;margin:12px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* toasts */
 /* compte à rebours des temps morts : flottant, ne bloque pas l'interface */
#tmr{--tc:#23924A;display:flex;align-items:center;gap:12px;background:var(--surface);border:3px solid var(--tc);border-radius:16px;padding:6px 8px 6px 10px;margin-bottom:8px;transition:border-color .3s}
#tmr[hidden]{display:none}
#tmr .ring{position:relative;width:56px;height:56px;flex:none}
#tmr .ring svg{width:56px;height:56px;transform:rotate(-90deg)}
#tmr .ring .sec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;color:var(--tc);font-variant-numeric:tabular-nums}
#tmr .tl{display:flex;flex-direction:column;line-height:1.15;flex:1}
#tmr .tl b{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600}
#tmr .tl small{color:var(--muted)}
#tmr .x{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;flex:none}
#tmr.done{animation:tpulse .6s ease-in-out 4}
@keyframes tpulse{50%{transform:scale(1.02)}}
#toasts{position:fixed;left:0;right:0;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{max-width:640px;width:100%;padding:12px 16px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.15);animation:tin .25s ease-out}
.toast.lib{background:var(--libBg);color:var(--libInk);border-color:var(--l)}
.toast.warn{background:var(--warnBg);color:var(--warn);border-color:var(--warn)}
.toast.ok{background:var(--okBg);color:var(--ok);border-color:var(--ok)}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}

/* stats */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:var(--surface2)}
.bar{position:relative;min-width:120px}
.bar i{position:absolute;left:0;top:50%;height:10px;transform:translateY(-50%);background:var(--team);border-radius:5px;opacity:.85}
.bar b{position:relative;padding-left:4px;mix-blend-mode:normal}
.barcell{display:flex;align-items:center;gap:8px}
.barcell .track{flex:1;height:10px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);min-width:70px;overflow:hidden}
.barcell .track i{display:block;height:100%;background:var(--team)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
@media (max-width:640px){.cols3{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--rc);border-radius:12px;padding:10px}
.pch{display:flex;align-items:center;gap:8px}.pch .num{min-width:34px;height:34px;font-size:18px}.pch b{font-weight:600;line-height:1.15;font-size:15px}
.pcard .barcell .track{min-width:40px}
table.fxm{width:100%;margin-top:8px;font-size:14px}
table.fxm th,table.fxm td{padding:3px 4px;border-bottom:1px solid var(--line)}
table.fxm td.m,table.fxm td.p,table.fxm th.m,table.fxm th.p{text-align:center;width:30px;font-weight:700;font-variant-numeric:tabular-nums}
.fxm .m{color:var(--pu)}.fxm .p{color:var(--r4)}.fxm .n0{color:var(--muted);text-align:center;width:30px;font-weight:700}.fxm .z{color:var(--muted);font-weight:400}
.fxt{display:flex;justify-content:space-between;margin-top:8px;font-weight:700;font-size:14px}.fxt .m{color:var(--pu)}.fxt .p{color:var(--r4)}
.arch{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.arch:last-child{border-bottom:0}
.arch .who{flex:1;min-width:180px}
.arch .who small{display:block;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:48px;padding:0 16px;border:0;background:var(--surface);font-weight:600}
.seg button.on{background:var(--team);color:var(--teamInk)}
.sticky{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
@media (max-width:560px){
  .tside .big{font-size:50px}.tside{min-height:76px;padding:6px 10px}.tside .tn{font-size:17px}
  .roles .rc{min-width:34px}
  .prow{flex-wrap:wrap}.prow .roles{width:100%;justify-content:flex-start;padding-left:54px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

  R.forEach(p=>{present[p.id]=p.id!=='p1'&&!(p.grp&&seen.has(p.grp));if(p.grp&&present[p.id])seen.add(p.grp);roles[p.id]=(p.postes&&p.postes[0])||'R4';});
  const m={v:1,id:Date.now().toString(36),team:'Gigean M18F dep',opp:'',date:today(),num:'',roster:R,present,roles,
    extras:[{id:'x1',on:false,n:'',nom:'',pre:''},{id:'x2',on:false,n:'',nom:'',pre:''}],ev:[],redo:[]};
  m.roles.x1='R4';m.roles.x2='R4';
  if(prev){
    m.team=prev.team;
    const pr=replay(prev).roles;
    R.forEach(p=>{if(prev.present&&p.id in prev.present)m.present[p.id]=prev.present[p.id];if(pr[p.id])m.roles[p.id]=pr[p.id];});
    ['x1','x2'].forEach(x=>{if(pr[x])m.roles[x]=pr[x];});
    m.extras=JSON.parse(JSON.stringify(prev.extras));
  }
  {const seen=new Set();let n=m.extras.filter(x=>x.on).length;
   R.slice().sort((a,b)=>a.n-b.n).forEach(p=>{if(!m.present[p.id])return;const k=p.grp||p.id;if(seen.has(k))return;if(n>=MAX_SEL){m.present[p.id]=false;return;}seen.add(k);n++;});
  }
  return m;
}
function extraAsPlayer(x){return {id:x.id,n:parseInt(x.n)||0,nom:String(x.nom||'').toUpperCase(),pre:String(x.pre||'').toUpperCase(),postes:[],extra:true};}
function rosterOf(m){return m.roster||ROSTER;}
// Joueuses sélectionnées : une joueuse en double (même personne, deux maillots) compte pour une
function selCount(m){const seen=new Set();rosterOf(m).forEach(p=>{if(m.present[p.id])seen.add(p.grp||p.id);});return seen.size+m.extras.filter(x=>x.on).length;}
function allPlayers(m){return rosterOf(m).concat(m.extras.filter(x=>x.on).map(extraAsPlayer));}

}

function rotate(z){const f=z[1];for(let i=1;i<6;i++)z[i]=z[i+1];z[6]=f;}

const SLOT=['Pa','R4','C','Pu','R4','C'];
// Deux ordres 5-1 valides à partir de la passeuse : A = passe, R4, centrale… ; B = passe, centrale, R4…
const SLOTS={A:SLOT,B:['Pa','C','R4','Pu','C','R4']};
// L'équipe joue l'ordre du PDF de rotation : passe, R4, centrale, pointue, R4, centrale
function sysOf(zones,roles){return 'A';}
// R4 et centrales inversées (oppositions correctes mais ordre de rotation faux) : paires de places à échanger
function rcSwaps(zones,roles){
  const s=setterZone(zones,roles);if(!s||is42(zones,roles))return [];
  const Z=k=>((s-1+k)%6)+1,out=[];
  for(const [a,b] of [[1,2],[4,5]]){const za=Z(a),zb=Z(b);if(roles[zones[za]]==='C'&&roles[zones[zb]]==='R4')out.push([za,zb]);}
  return out;
}
// Postes « de placement » : déduits de la place par rapport à la passeuse (P1…P6),
// pour que le placement reste juste même si la composition n'est pas conforme.
// Jeu en 4-2 : deux passeuses sur le terrain
function is42(zones,roles){let n=0;for(let z=1;z<=6;z++)if(zones[z]&&roles[zones[z]]==='Pa')n++;return n>=2;}
function posRoles(zones,roles){
  const s=setterZone(zones,roles);if(!s||is42(zones,roles))return roles;
  const pr=Object.assign({},roles);
  const SL=SLOTS[sysOf(zones,roles)];
  for(let z=1;z<=6;z++)if(zones[z])pr[zones[z]]=SL[(z-s+6)%6];
  return pr;
}
function effective(zones,roles,lib,serving){
  const pr=posRoles(zones,roles);
  const eff=zones.slice();let libFor=null,libZone=null;
  if(lib&&!zones.includes(lib)){
    for(const z of [5,6,1]){
      if(pr[eff[z]]==='C'&&!(z===1&&serving==='G')){libFor=eff[z];libZone=z;eff[z]=lib;break;}
    }
  }
  return {eff,libFor,libZone,pr};
}

function assign(ids,roles,prefs,slots){
  const out={},free=slots.slice();

  ids.filter(Boolean).sort((a,b)=>pr(roles[a])-pr(roles[b])).forEach(id=>{
    const s=(prefs[roles[id]]||slots).find(s=>free.includes(s))??free[0];

}

// Placement réglementaire : deux lignes de trois
const POS={4:[17,20],3:[50,20],2:[83,20],5:[17,68],6:[50,68],1:[83,68]};
// Positions de réception par rotation (P = zone de la passeuse), clé = zone réglementaire.
// Coordonnées relevées sur l'animation fournie (filet en haut, % largeur / % profondeur).
// Réception pour l'ordre B (passe suivie de la centrale), construite en respectant les règles de chevauchement
const RECEPB={
 1:{4:[12,15],3:[48,58],2:[80,15],5:[20,62],6:[75,66],1:[90,76]},
 6:{4:[12,15],3:[40,12],2:[50,58],5:[20,62],6:[56,30],1:[80,66]},

 2:{4:[20,58],3:[55,15],2:[85,12],5:[10,85],6:[50,68],1:[80,62]},
};
const RECEP={
 1:{4:[18,17],3:[50,17],2:[77,53],5:[18,63],6:[51,73],1:[88,68]},
 6:{4:[22,62],3:[67,11],2:[81,17],5:[53,76],6:[71,35],1:[84,62]},
 5:{4:[16,17],3:[21,65],2:[84,17],5:[45,26],6:[50,77],1:[84,68]},
 4:{4:[8,11],3:[15,28],2:[54,71],5:[25,65],6:[81,65],1:[92,82]},
 3:{4:[20,59],3:[63,17],2:[74,30],5:[50,69],6:[66,85],1:[83,62]},
 2:{4:[11,27],3:[20,58],2:[84,15],5:[36,89],6:[50,65],1:[84,62]},
};
// Ordre 5-1 attendu à partir de la passeuse, dans le sens de la rotation (A = R4 ou pointue)
const STD=['Pa','A','C','A','A','C'];
function isStd(zones,roles,s){
  for(let z=1;z<=6;z++){const r=roles[zones[z]],e=STD[(z-s+6)%6];
    if(e==='A'?!(r==='R4'||r==='Pu'):r!==e)return false;}
  return true;
}
function playCoords(zones,roles,lib,serving){
  const {eff,libFor,pr}=effective(zones,roles,lib,serving),out={};
  if(is42(zones,roles)){for(let z=1;z<=6;z++)out[eff[z]]=POS[z];return {eff,libFor,out,mode:'42'};}
  if(serving==='G'){const map=layoutPlay(eff,pr);for(const s in map)out[map[s]]=POS[s];return {eff,libFor,out,mode:'serve'};}
  const s=setterZone(zones,roles);
  if(s){const T=sysOf(zones,roles)==='B'?RECEPB:RECEP;for(let z=1;z<=6;z++)out[eff[z]]=T[s][z];return {eff,libFor,out,mode:'recep'};}
  for(let z=1;z<=6;z++)out[eff[z]]=POS[z];
  return {eff,libFor,out,mode:'fallback'};
}
// Joueuse au service : toujours derrière le poste 1, au fond du terrain
const SERVE=[84,98];
// Orientation : 0 filet en haut, 1 filet à droite, 2 filet en bas, 3 filet à gauche
// Changement de côté à chaque set : sets 2 et 4 inversés par rapport au réglage de base
let PAR=0;
const mirrorO=o=>o===1?3:o===3?1:o;
function dispOrient(){const b=store.prefs.orient||0;return PAR%2?mirrorO(b):b;}
function dispSwap(){return !!store.prefs.swapT!==!!(PAR%2);}
function oxy(c){const o=dispOrient();let [x,y]=c;
  if(o===1)[x,y]=[100-y,x];else if(o===2)[x,y]=[100-x,100-y];else if(o===3)[x,y]=[y,100-x];
  return [x,y];}
function xy(c){const [x,y]=oxy(c);return `left:${x}%;top:${y}%`;}
function tokenHTML(m,id,role,c,o){
  const p=pById(m,id);
  return `<button class="tok ${rcls(role)} ${o.flash?'flash':''}" style="${xy(c,o.flip)}" data-act="${o.act}" data-id="${id}" data-z="${o.zone||''}" aria-label="${esc(tag(m,id))}, ${esc(ROLES[role]||'')}">
    <span class="disc">${esc(p.n)}<span class="rl">${esc(role||'?')}</span>${o.zone?`<span class="zn">P${o.zone}</span>`:''}${o.srv?`<span class="ballb">${IC.ball}</span>`:''}</span>
    <span class="nm">${esc(dname(m,id))}</span>${o.srv?`<span class="sub" style="background:var(--pa);color:#241B00">au service</span>`:''}
  </button>`;
}
function courtHTML(m,o){
  const flip=0,or=dispOrient();let t='';
  if(o.mode==='official'){
    for(let z=1;z<=6;z++){const id=o.zones[z];
      t+=id?tokenHTML(m,id,o.roles[id],POS[z],{act:'pickZone',zone:z,flip}):`<button class="zempty" style="${xy(POS[z],flip)}" data-act="pickZone" data-z="${z}"><b>${z}</b><span>${z===1?'Service':'Choisir'}</span></button>`;}
  } else if(o.mode==='regl'){
    const {eff,libFor}=effective(o.zones,o.roles,o.lib,o.serving);
    for(let z=1;z<=6;z++){const id=eff[z];if(!id)continue;const isLib=id===o.lib&&libFor;
      const srv=o.serving==='G'&&z===1;t+=tokenHTML(m,id,o.roles[id],srv?SERVE:POS[z],{act:o.act||'none',zone:z,flip,libFor:isLib?libFor:null,srv,flash:isLib&&o.flash});}
  } else {
    const {eff,libFor,out}=playCoords(o.zones,o.roles,o.lib,o.serving);
    for(let z=1;z<=6;z++){const id=eff[z];if(!id||!out[id])continue;const isLib=id===o.lib&&libFor;
      const srv=o.serving==='G'&&z===1;t+=tokenHTML(m,id,o.roles[id],srv?SERVE:out[id],{act:o.act||'none',flip,libFor:isLib?libFor:null,srv,flash:isLib&&o.flash});}
  }
  return `<div class="courtwrap o${or} ${or%2?'side':''}"><div class="court o${or} ${or%2?'side':''} ${o.small?'small':''}" ${o.main?'id="mainCourt"':''}><div class="net"></div><div class="attack"></div><span class="netlbl">FILET</span>${t}</div></div>`;
}

function render(){
  if(ui.screen!=='coach')ui.coach=false;
  const m=store.cur,S=replay(m);let h;
  PAR=(ui.screen==='lineup'&&ui.draft)?(ui.draft.set||0):Math.max(0,S.sets.length-1);
  const old={};document.querySelectorAll('#mainCourt .tok').forEach(t=>{old[t.dataset.id]=t.getBoundingClientRect();});
  if(ui.screen==='coach'&&ui.coach)h=coachHTML();
  else if(ui.screen==='lineup'&&ui.draft)h=lineupHTML(m,S);
  else if(ui.screen==='setup'||S.sets.length===0)h=setupHTML(m,S);
  else h=matchHTML(m,S);
  $('#app').innerHTML=h;if(tmr)tmrTick();
  const sh=$('#sheet');sh.innerHTML=ui.sheet?`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog">${sheetHTML(m,S)}</div>`:'';
  sh.classList.toggle('open',!!ui.sheet);
  const al=$('#alert');al.innerHTML=ui.roleFor?roleBoxHTML(m,S):ui.alert?alertHTML(m):'';
  al.classList.toggle('open',!!(ui.alert||ui.roleFor));
  ui.flashLib=false;
  if(ui.coachJump&&ui.screen==='coach'){const e=document.getElementById('rosterSec');if(e)e.scrollIntoView({block:'start'});ui.coachJump=null;}
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches&&Object.keys(old).length){
    document.querySelectorAll('#mainCourt .tok').forEach(t=>{
      const o=old[t.dataset.id];
      if(!o){t.animate([{opacity:0},{opacity:1}],{duration:350});return;}
      const n=t.getBoundingClientRect(),dx=(o.left+o.width/2)-(n.left+n.width/2),dy=(o.top+o.height/2)-(n.top+n.height/2);
      if(Math.abs(dx)<2&&Math.abs(dy)<2)return;
      t.animate([{transform:`translate(-50%,-50%) translate(${dx}px,${dy}px)`},{transform:'translate(-50%,-50%)'}],{duration:650,easing:'cubic-bezier(.25,.8,.25,1)'});
    });
  }
}

const SK={srv:'Service',rec:'Réception',def:'Défense',att:'Attaque'};

function rallyCtx(S){
  if(S.phase!=='play')return null;
  const {eff}=effective(S.zones,S.roles,S.lib,S.serving);
  return {on:eff.slice(1).filter(Boolean),front:[eff[2],eff[3],eff[4]],srv:S.serving==='G'?eff[1]:null};

    ${courtHTML(m,{mode:regl?'regl':'play',zones:S.zones,roles:S.roles,lib:S.lib,serving:S.serving,act:play?'tapCourt':'none',flash:ui.flashLib,main:true})}
    ${e.libFor?`<p class="libinfo">Libéro ${esc(tag(m,S.lib))} à la place de ${esc(tag(m,e.libFor))}</p>`:''}

/* ============ ESPACE ENTRAÎNEUR ============ */
function stats(m){
  const S=replay(m),teamSets=S.sets.map(s=>s.rallies),total=teamSets.reduce((a,b)=>a+b,0);
  const ids=new Set(present(m).filter(p=>!p.extra).map(p=>p.id));Object.keys(S.played).forEach(id=>ids.add(id));
  const rows=[...ids].map(id=>{const p=pById(m,id),arr=(S.played[id]||[0,0,0,0,0]).slice(0,S.sets.length),tot=arr.reduce((a,b)=>a+b,0);
    return {id,n:p.n,name:dname(m,id),full:`${title(p.pre)} ${p.nom}`,role:S.roles[id],sets:arr,tot,pct:total?tot/total*100:0};}).sort((a,b)=>a.n-b.n);
  return {S,rows,teamSets,total,fx:fxStats(m,S,null)};
}
const FXK=['srvM','srvN','srvP','recM','recN','recP','defM','defP','attM','attP'];
function fxStats(m,S,set){
  const sets=set==null?[0,1,2,3,4]:[set];
  const sum=id=>{const o={};FXK.forEach(k=>o[k]=0);const a=S.fx[id];if(a)sets.forEach(i=>FXK.forEach(k=>o[k]+=a[i][k]||0));o.M=o.srvM+o.recM+o.defM+o.attM;o.P=o.srvP+o.recP+o.defP+o.attP;return o;};
  const ids=new Set(present(m).filter(p=>!p.extra).map(p=>p.id));Object.keys(S.fx).forEach(id=>{if(id!=='_eq')ids.add(id);});
  const rows=[...ids].map(id=>{const p=pById(m,id);return Object.assign({id,n:p.n,full:`${title(p.pre)} ${p.nom}`.trim()+(p.extra?' (hors feuille)':''),role:S.roles[id]},sum(id));}).sort((a,b)=>a.n-b.n);
  const eq=Object.assign({},sum('_eq'));
  const tot={};FXK.concat(['M','P']).forEach(k=>tot[k]=rows.reduce((a,r)=>a+r[k],0)+eq[k]);
  const ss=S.sets.filter((x,i)=>set==null||i===set);
  const opp=ss.reduce((a,x)=>a+x.a,0),oppF=ss.reduce((a,x)=>a+(x.oppFault||0),0);
  return {rows,eq,tot,opp,oppF};
}
// Regroupement : R4 | centrales et libéro | pointue et passe
const GRP=r=>r==='C'||r==='L'?1:(r==='Pu'||r==='Pa')?2:0;
const GORD={R4:0,C:0,L:1,Pu:0,Pa:1};
function grpSort(rows){return rows.slice().sort((a,b)=>GRP(a.role)-GRP(b.role)||(GORD[a.role]??2)-(GORD[b.role]??2)||a.n-b.n);}
function statCols(m,S){
  if(!S.sets.length)return '<div class="card hint">Aucun point joué pour ce match.</div>';
  const set=ui.fxSet,f=fxStats(m,S,set);
  const tot=set==null?S.sets.reduce((a,x)=>a+x.rallies,0):(S.sets[set]?S.sets[set].rallies:0);
  const played=id=>{const a=S.played[id]||[0,0,0,0,0];return set==null?a.reduce((x,y)=>x+y,0):(a[set]||0);};
  const seg=`<div class="seg" style="margin-bottom:10px;flex-wrap:wrap"><button class="${set==null?'on':''}" data-act="fxSet" data-v="">Match</button>${S.sets.map((x,i)=>`<button class="${set===i?'on':''}" data-act="fxSet" data-v="${i}">S${i+1}</button>`).join('')}</div>`;
  const cnt=v=>v?v:'<span class="z">·</span>';
  const card=r=>{const pl=played(r.id),pct=tot?pl/tot*100:0,ex=isExtra(r.id);
    return `<div class="pcard ${rcls(r.role)}"><div class="pch"><span class="num ${rcls(r.role)}">${r.n}</span><b>${esc(r.full)}</b></div>
      ${ex?'<div class="hint" style="margin:6px 0">Hors feuille : pas de temps de jeu</div>':`<div class="barcell" style="margin:8px 0 2px"><span class="track"><i style="width:${pct.toFixed(1)}%"></i></span><b>${pct.toFixed(0)} %</b></div><small class="hint">${pl} / ${tot} points joués</small>`}
      <table class="fxm"><tr><th></th><th class="m">−</th><th class="n0">=</th><th class="p">+</th></tr>${[['srv','Service'],['rec','Réception'],['def','Défense'],['att','Attaque']].map(([k,l])=>`<tr><td>${l}</td><td class="m">${cnt(r[k+'M'])}</td><td class="n0">${k==='srv'?cnt(r.srvN):''}</td><td class="p">${cnt(r[k+'P'])}</td></tr>`).join('')}</table>
      <div class="fxt"><span class="m">Fautes ${r.M}</span><span class="p">Positifs ${r.P}</span></div></div>`;};
  const cols=[[],[],[]];grpSort(f.rows).forEach(r=>cols[GRP(r.role)].push(r));
  return seg+`<div class="card" style="margin-bottom:12px"><b>Équipe${set==null?'':' — set '+(set+1)}</b>
      <div class="hint" style="margin-top:4px">${tot} points disputés · services ${f.tot.srvM+f.tot.srvN+f.tot.srvP} (${f.tot.srvN} neutres) · réceptions ${f.tot.recM+f.tot.recN+f.tot.recP} (${f.tot.recN} neutres) · fautes ${f.tot.M} · positifs ${f.tot.P}${f.eq.M||f.eq.P?` (dont non attribuées : ${f.eq.M} fautes, ${f.eq.P} positifs)`:''} · points adverses sur une faute de Gigean : ${f.oppF} sur ${f.opp}${f.opp?` (${Math.round(f.oppF/f.opp*100)} %)`:''}</div></div>
    <div class="cols3">${cols.map(c=>`<div class="col">${c.map(card).join('')}</div>`).join('')}</div>`;
}
function fxTable(m,S){
  if(!S.sets.length)return '<div class="card hint">Aucun point joué pour ce match.</div>';
  const f=fxStats(m,S,ui.fxSet),c=v=>v?v:'<span style="color:var(--muted)">·</span>';
  const seg=`<div class="seg" style="margin-bottom:10px;flex-wrap:wrap"><button class="${ui.fxSet==null?'on':''}" data-act="fxSet" data-v="">Match</button>${S.sets.map((x,i)=>`<button class="${ui.fxSet===i?'on':''}" data-act="fxSet" data-v="${i}">S${i+1}</button>`).join('')}</div>`;
  const tr=(lab,r,cls)=>`<tr class="${cls||''}">${lab}${FXK.map(k=>`<td class="n">${c(r[k])}</td>`).join('')}<td class="n" style="color:var(--pu);font-weight:700">${r.M}</td><td class="n" style="color:var(--r4);font-weight:700">${r.P}</td></tr>`;
  return seg+`<div class="tblwrap"><table><thead><tr><th>N°</th><th>Joueuse</th><th class="n">Serv −</th><th class="n">Serv +</th><th class="n">Réc −</th><th class="n">Réc +</th><th class="n">Déf −</th><th class="n">Déf +</th><th class="n">Att −</th><th class="n">Att +</th><th class="n">Fautes</th><th class="n">Positifs</th></tr></thead><tbody>
    ${f.rows.map(r=>tr(`<td><span class="num ${rcls(r.role)}" style="min-width:30px;height:30px;font-size:16px">${r.n}</span></td><td>${esc(r.full)}</td>`,r)).join('')}
    ${f.eq.M||f.eq.P?tr('<td></td><td>Non attribuée</td>',f.eq):''}
    ${tr('<td></td><td>Équipe</td>',f.tot,'tot')}</tbody></table></div>
    <p class="hint">Points adverses sur une faute de Gigean : ${f.oppF} sur ${f.opp}${f.opp?` (${Math.round(f.oppF/f.opp*100)} %)`:''}.</p>`;
}
function matchTitle(m){return `${m.team||'Équipe'} – ${m.opp||'Adversaire'}`;}

async function saveFile(filename,data){
  try{
    const dl=await downloadsCap();
    if(dl){await dl.save({filename,data});toast('Fichier enregistré','ok');return;}
  }catch(e){
    if(e&&e.code==='declined'){toast('Enregistrement annulé');return;}
    if(e&&e.code==='rate_limited'){toast('Une demande est déjà ouverte, réessayez dans un instant','warn');return;}
  }
  try{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();}
  catch(e){toast('Le téléchargement n\'est pas possible ici','warn');}
}

function lean(m){const c=JSON.parse(JSON.stringify(m));delete c.redo;delete c.pend;return c;}

  stDel(d){const m=store.cur;if(!m.pend)return;m.pend.splice(+d.i,1);save();},
  fxSet(d){ui.fxSet=d.v===''?null:+d.v;},
  pt(d){const m=store.cur;if(replay(m).phase!=='play')return 1;const st=(m.pend||[]).slice();m.pend=[];dispatch(st.length?{t:'pt',w:d.w,st}:{t:'pt',w:d.w});return 1;},
  undo(){undo();return 1;}, redo(){redo();return 1;},
  tapCourt(d){const S=replay(store.cur),e=effective(S.zones,S.roles,S.lib,S.serving);ui.sub={o:d.id===S.lib?e.libFor:d.id,i:null,fixed:true};ui.sheet='sub';},
  bench(d){const S=replay(store.cur);if(S.phase!=='play')return;const e=effective(S.zones,S.roles,S.lib,S.serving);
    if(S.roles[d.id]==='L')ui.sub={o:null,i:null};else if(d.id===e.libFor)ui.sub={o:d.id,i:null,fixed:true};else ui.sub={o:null,i:d.id,fixedI:true};ui.sheet='sub';},
  openSub(){ui.sub={o:null,i:null};ui.sheet='sub';},
  subO(d){ui.sub.o=d.id;}, subI(d){ui.sub.i=d.id;},
  subOk(){const {o,i}=ui.sub;if(!o||!i)return;ui.sheet=null;const m=store.cur,S=replay(m),ro=S.roles[o],ri=S.roles[i];
    dispatch({t:'sub',o,i});
    if(ro==='Pu'&&ri==='Pa'){const S2=replay(m),oz=[1,2,3,4,5,6].find(z=>S2.zones[z]&&S2.zones[z]!==i&&S2.roles[S2.zones[z]]==='Pa');
      if(oz){const pa=S2.zones[oz];
        ui.alertMode=null;ui.alertClose=false;ui.alertChoice=true;
        ui.alert=[`${dname(m,i)} (${pnum(m,i)}, Passe) remplace ${dname(m,o)} (${pnum(m,o)}, Pointue) : deux passeuses sont maintenant sur le terrain, avec ${dname(m,pa)} (${pnum(m,pa)}) au poste ${oz}.`];
        ui.alertFixes=[{p:pa,r:'Pu',lab:`Changer l'opposée : ${dname(m,pa)} passe en Pointue`},{p:i,r:'Pu',lab:`Changer la passeuse entrante : ${dname(m,i)} en Pointue`},{fourtwo:true,lab:'Ne rien faire (passage en 4-2)'}];
        render();return 1;}}
    if(ro&&ro!==ri&&ro!=='L'){const msg=`${dname(m,i)} (${pnum(m,i)}, ${ROLES[ri]||'sans poste'}) remplace ${dname(m,o)} (${pnum(m,o)}, ${ROLES[ro]}) : les postes sont différents.`;
      ui.alertMode=null;ui.alertClose=null;ui.alert=[msg].concat(ui.alert||[]);ui.alertFixes=[{p:i,r:ro}].concat(ui.alertFixes||[]).filter((f,j,a)=>a.findIndex(g=>g.p===f.p&&g.r===f.r)===j);render();}
    return 1;},
  setLib(d){const S=replay(store.cur);const v=d.id||null;if(v!==S.lib){ui.sheet=null;dispatch({t:'lib',p:v});return 1;}},
  to(d){const S=replay(store.cur),set=S.sets[S.sets.length-1];if(set.to[d.s]>=2){toast('Les 2 temps morts de ce set sont déjà pris','warn');return;}dispatch({t:'to',s:d.s});startTimer(`Temps mort ${d.s==='G'?short(store.cur):'adverse'} (${set.to[d.s]+1}/2)`);return 1;},
  tmrClose(){stopTimer();return 1;},
  roles(){ui.sheet='roles';},
  role(d){const m=store.cur,S=replay(m);if(S.sets.length===0){m.roles[d.id]=d.r;save();}else if(S.roles[d.id]!==d.r){dispatch({t:'role',p:d.id,r:d.r});return 1;}},
  menu(){ui.sheet='menu';},
  flip(){const nd=(dispOrient()+1)%4;store.prefs.orient=PAR%2?mirrorO(nd):nd;save();toast('Filet '+['en haut','à droite','en bas','à gauche'][nd]);},
  view(d){store.prefs.view=d.v;save();},
  dockTog(){store.prefs.dockOpen=!store.prefs.dockOpen;save();},
  swapT(){store.prefs.swapT=!store.prefs.swapT;save();toast(dispSwap()?`${short(store.cur)} à droite`:`${short(store.cur)} à gauche`);},
  sound(){store.prefs.sound=!store.prefs.sound;save();if(store.prefs.sound)beep('ok');},
  lock(){openLock();},
  rosterGo(){ui.coachJump='roster';openLock();},
  key(d){
    if(d.k==='del')ui.code=ui.code.slice(0,-1);else if(ui.code.length<4)ui.code+=d.k;
    if(ui.code.length===4){
      if(ui.code===CODE){ui.coach=true;ui.screen='coach';ui.sheet=null;ui.coachView=null;}
      else{ui.code='';render();const el=$('#dots');if(el){el.classList.add('shake');}toast('Code incorrect','warn');return 1;}
    }
  },
  relock(){ui.coachJump=null;ui.coach=false;ui.screen=null;ui.coachView=null;},
  toMatch(){ui.screen=null;ui.sheet=null;},
  toSetup(){ui.screen='setup';ui.sheet=null;},
  compose(){const m=store.cur,S=replay(m);
    if(ui.draft&&ui.draft.set===S.sets.length){const pres=new Set(present(m).map(p=>p.id));
      for(let z=1;z<=6;z++){const id=ui.draft.zones[z];if(id&&(!pres.has(id)||S.roles[id]==='L'))ui.draft.zones[z]=null;}
      if(ui.draft.lib&&(!pres.has(ui.draft.lib)||S.roles[ui.draft.lib]!=='L'))ui.draft.lib=null;}
    else ui.draft=initDraft(m,S);
    ui.screen='lineup';ui.sheet=null;ui.draftKey='';draftCheck();},
  cancelLineup(){ui.screen=null;ui.draft=null;},
  pickZone(d){ui.pick=+d.z;ui.sheet='pick';},
  pickP(d){const z=ui.pick,zs=ui.draft.zones,k=zs.indexOf(d.id);if(k>0&&k!==z)zs[k]=zs[z];zs[z]=d.id;ui.sheet=null;draftCheck();placeCheck(z);},
  pickClear(){ui.draft.zones[ui.pick]=null;ui.sheet=null;draftCheck();},
  draftSrv(d){ui.draft.srv=d.s;}, draftLib(d){ui.draft.lib=d.id||null;},
  startGo(){ui.alert=null;ui.alertMode=null;ui.swapRC=null;return A.startSet({},true);},
  startSet(_d,force){const d=ui.draft;if(!d.zones.slice(1).every(Boolean))return;
    if(!force){const w=draftIssues();if(w.length){const S0=replay(store.cur),sw=rcSwaps(d.zones,S0.roles);
      const swIds=sw.flat().map(z=>d.zones[z]),w2=w.filter(x=>!(String(x.key||'').startsWith('P:')&&swIds.includes(String(x.key).split(':')[1])));
      ui.alert=(sw.length?[`Ordre de rotation inversé : les R4 et les centrales sont échangées par rapport au PDF de rotation (passe, R4, centrale, pointue, R4, centrale). Les oppositions sont bonnes, mais les joueuses ne tournent pas dans le bon ordre.`]:[]).concat(w2.map(String));
      ui.alertFixes=null;ui.swapRC=sw.length?sw:null;ui.alertMode='start';beep('warn');return;}}{const S0=replay(store.cur);ui.skipOppo=oppoIssues(store.cur,d.zones,S0.roles).map(x=>x.key).join('|')||null;}ui.screen=null;ui.draft=null;dispatch({t:'set',z:d.zones.slice(1),s:d.srv,l:d.lib});if((d.set||0)>0)toast(`Changement de côté : ${short(store.cur)} ${dispSwap()?'à droite':'à gauche'}${(store.prefs.orient||0)%2?', filet '+(dispOrient()===1?'à droite':'à gauche'):''}`);return 1;},
  pres(d){const m=store.cur,S=replay(m);const on=!m.present[d.id];
    if(!on&&S.phase==='play'&&(S.zones.includes(d.id)||d.id===S.lib)){toast('Cette joueuse est sur le terrain ou libéro active : faites d\'abord un changement','warn');return;}
    const before=Object.assign({},m.present);
    m.present[d.id]=on;const p=rosterOf(m).find(p=>p.id===d.id);
    if(on&&p&&p.grp)rosterOf(m).filter(q=>q.grp===p.grp&&q.id!==p.id).forEach(q=>{if(S.phase==='play'&&(S.zones.includes(q.id)||q.id===S.lib))return;m.present[q.id]=false;});
    if(on&&selCount(m)>MAX_SEL){m.present=before;toast('14 joueuses sont déjà sélectionnées : décochez-en une d\'abord','warn');return;}
    save();},
  xOn(d){const m=store.cur,x=m.extras[+d.x],S=replay(m);
    if(x.on&&S.phase==='play'&&(S.zones.includes(x.id)||x.id===S.lib)){toast('Cette joueuse est sur le terrain : faites d\'abord un changement','warn');return;}
    if(!x.on&&selCount(m)>=MAX_SEL){toast('14 joueuses sont déjà sélectionnées : décochez-en une d\'abord','warn');return;}
    x.on=!x.on;save();},
  newMatch(){if(ui.confirm!=='new'){ui.confirm='new';return 'keep';}archiveCur();store.cur=newMatch(store.cur,store.roster);save();ui.screen='setup';ui.sheet=null;toast('Match archivé, nouvelle feuille prête','ok');},
  cv(d){ui.coachView=d.id||null;},
  pdf(d){const m=d.id?store.arch.find(a=>a.id===d.id):store.cur;if(m)exportPDF(m);return 1;},
  rosterJson(){saveFile(`effectif-gigean_${today()}.json`,JSON.stringify({app:'gigean-volley',type:'effectif',v:1,exported:new Date().toISOString(),roster:store.roster},null,1));return 1;},
  json(){saveFile(`gigean-volley_${today()}.json`,JSON.stringify({app:'gigean-volley',v:1,exported:new Date().toISOString(),cur:lean(store.cur),arch:store.arch,roster:store.roster}));return 1;},
  import(){$('#importFile').click();return 1;},
  resume(d){const key='res:'+d.id;if(ui.confirm!==key){ui.confirm=key;return 'keep';}
    const k=store.arch.findIndex(a=>a.id===d.id);if(k<0)return;const m=store.arch.splice(k,1)[0];archiveCur();m.redo=[];store.cur=m;save();ui.screen=null;ui.coachView=null;toast('Match repris','ok');},
  del(d){const key='del:'+d.id;if(ui.confirm!==key){ui.confirm=key;return 'keep';}store.arch=store.arch.filter(a=>a.id!==d.id);if(ui.coachView===d.id)ui.coachView=null;save();toast('Match supprimé');},
};
// Import d'un effectif : remplace l'effectif de l'équipe ; appliqué au match en cours s'il n'a pas commencé
function importRoster(list){
  const seen=new Set(),R=[];
  list.forEach(p=>{if(!p||typeof p!=='object')return;const n=parseInt(p.n);if(!n||n<1||n>99)return;
    let id=String(p.id||'r'+n+'_'+Math.random().toString(36).slice(2,6));if(seen.has(id))return;seen.add(id);
    const postes=(Array.isArray(p.postes)?p.postes:[]).filter(r=>ROLES[r]);
    const q={id,n,nom:String(p.nom||'').toUpperCase(),pre:String(p.pre||'').toUpperCase(),postes:postes.length?postes:['R4']};if(p.grp)q.grp=String(p.grp);R.push(q);});
  if(!R.length)throw 0;
  store.roster=R.slice(0,MAX_ROSTER);
  const m=store.cur,S=replay(m);
  if(S.sets.length===0){const fresh=newMatch(null,store.roster);fresh.team=m.team;fresh.opp=m.opp;fresh.date=m.date;fresh.num=m.num;fresh.extras=m.extras;
    store.roster.forEach(p=>{if(m.present&&p.id in m.present)fresh.present[p.id]=m.present[p.id];if(m.roles&&m.roles[p.id])fresh.roles[p.id]=m.roles[p.id];});
    fresh.id=m.id;store.cur=fresh;}
  return store.roster.length;
}
function rKeep(){const r=ui.redit;if(!r)return;const g=id=>{const e=document.getElementById(id);return e?e.value:null;};const n=g('rN'),a=g('rNom'),b=g('rPre');if(n!==null)r.n=n;if(a!==null)r.nom=a;if(b!==null)r.pre=b;}
function addStat(x){const m=store.cur;(m.pend||(m.pend=[])).push(x);save();render();}
function initDraft(m,S){
  const i=S.sets.length,prev=S.sets[i-1],pres=new Set(present(m).map(p=>p.id));
  const zones=[null,null,null,null,null,null,null];
  if(prev)for(let z=1;z<=6;z++){const id=prev.lineup[z];if(pres.has(id)&&S.roles[id]!=='L')zones[z]=id;}
  let srv='G';if(prev)srv=prev.srv==='G'?'A':'G';
  const libs=present(m).filter(p=>S.roles[p.id]==='L').map(p=>p.id);
  const lib=prev&&prev.lib&&libs.includes(prev.lib)?prev.lib:(libs[0]||null);
  return {set:i,zones,srv,lib};
}
// Double toucher sur une joueuse (composition et changement uniquement) : choix du poste
const DBL={subO:'now',subI:'now',pickZone:'delay',pickP:'delay'};
let lastTap=null;
function runAct(fn,ds){const r=fn(ds);if(r!=='keep')ui.confirm=null;if(r!==1)render();}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const fn=A[b.dataset.act];if(!fn)return;
  const mode=b.dataset.id&&DBL[b.dataset.act];
  if(mode){
    const key=b.dataset.act+':'+b.dataset.id,now=Date.now(),ds=Object.assign({},b.dataset);
    if(lastTap&&lastTap.key===key&&now-lastTap.t<350){clearTimeout(lastTap.timer);lastTap=null;ui.roleFor=ds.id;render();return;}
    if(lastTap)clearTimeout(lastTap.timer);
    if(mode==='delay'){lastTap={key,t:now,timer:setTimeout(()=>{lastTap=null;runAct(fn,ds);},300)};return;}
    lastTap={key,t:now};
  } else lastTap=null;
  runAct(fn,b.dataset);
});
document.addEventListener('input',e=>{
  const t=e.target,m=store.cur;if(!t.dataset)return;
  if(t.dataset.x!==undefined){m.extras[+t.dataset.x][t.dataset.f]=t.value;save();}
  else if(t.dataset.f){m[t.dataset.f]=t.value;save();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&(t.dataset.x!==undefined||t.dataset.f))render();
});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{const d=JSON.parse(r.result);if(d.app!=='gigean-volley')throw 0;
      const list=(d.arch||[]).concat(d.cur&&d.cur.ev&&d.cur.ev.length?[d.cur]:[]);let n=0;
      list.forEach(mm=>{if(!mm||!mm.id||!Array.isArray(mm.ev))return;if(mm.id===store.cur.id||store.arch.some(a=>a.id===mm.id))return;store.arch.push(lean(mm));n++;});
      store.arch.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
      const rn=Array.isArray(d.roster)?importRoster(d.roster):-1;
      save();render();
      const msg=[];if(rn>=0)msg.push(`effectif importé (${rn} joueuses)`);if(n)msg.push(`${n} match(s) ajouté(s) à l'archive`);
      toast(msg.length?msg.join(' ; '):'Aucun nouveau match à importer',msg.length?'ok':'');
    }catch(err){toast('Fichier non reconnu : choisissez un export de cette application','warn');}
    e.target.value='';
  };
  r.readAsText(f);
});
render();
// Empêche la mise en veille de l'écran pendant l'utilisation (API Screen Wake Lock)
let wakeLock=null;
async function keepAwake(){
  if(!('wakeLock' in navigator)||wakeLock||document.visibilityState!=='visible')return;
  try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(e){wakeLock=null;}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake();});
document.addEventListener('click',keepAwake,true);
keepAwake();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
