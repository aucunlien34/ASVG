# Compilation des applis natives VolleyCoach (Capacitor) sur les serveurs GitHub.
# Android : APK de test téléchargeable dans l'onglet Actions (Artifacts) à chaque modification de la webapp.
# iOS : compilation de contrôle pour le simulateur (sans signature), lancée à la main.
name: Applis natives

on:
  workflow_dispatch:
    inputs:
      ios:
        description: "Compiler aussi iOS (simulateur)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - index.html
      - package.json
      - capacitor.config.json
      - scripts/**
      - .github/workflows/native.yml

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm ci
      - name: Projet Android
        run: |
          npm run build:www
          npx cap add android
          node scripts/native-patch.mjs
      - name: Icônes et écran de démarrage
        continue-on-error: true
        run: npm run native:icons
      - name: Synchronisation
        run: npx cap sync android
      - name: Version
        run: |
          V=$(grep -oE "APP_VERSION='V[0-9]+'" index.html | grep -oE '[0-9]+')
          echo "VC_VERSION=$V" >> $GITHUB_ENV
          sed -i "s/versionCode 1$/versionCode $V/; s/versionName \"1.0\"/versionName \"V$V\"/" android/app/build.gradle
      - name: Compilation (APK de test)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Taille
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "VolleyCoach-V${VC_VERSION}-debug.apk"
          echo "### VolleyCoach V${VC_VERSION} — APK de test : $(du -h VolleyCoach-V${VC_VERSION}-debug.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: VolleyCoach-V${{ env.VC_VERSION }}-android-debug
          path: VolleyCoach-V*-debug.apk
          retention-days: 30

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Xcode le plus récent
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Dépendances
        run: npm ci
      - name: Projet iOS
        run: |
          npm run build:www
          npx cap add ios
          node scripts/native-patch.mjs
      - name: Icônes et écran de démarrage
        continue-on-error: true
        run: npm run native:icons
      - name: Synchronisation
        run: npx cap sync ios
      - name: Compilation (simulateur, sans signature)
        shell: bash
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -30
